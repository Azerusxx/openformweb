name: Publish compiled openForm app
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-compiled-app.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download already compiled openForm web assets
        shell: bash
        env:
          ASSET_URL: 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-9ca0-822f-9ec3-6a58ca5a98d7/raw?se=2026-10-26T14%3A50%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=29fb7fc4-b701-52ca-9c47-6111552158ab&skoid=fae15675-a81a-44b5-9d8c-d8445a7c26a2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-26T14%3A03%3A39Z&ske=2026-10-27T14%3A03%3A39Z&sks=b&skv=2026-02-06&sig=0MHAZIbASc/Qs9bBmopCZxJrfjeRfJ4q8Acr/4SRp/A%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ASSET_URL" -o /tmp/artifact.zip
          mkdir -p /tmp/bundle /tmp/site
          unzip -q /tmp/artifact.zip -d /tmp/bundle
          unzip -q /tmp/bundle/openForm-Web-Pages.zip -d /tmp/site
          test -s /tmp/site/index.html
          test -d /tmp/site/assets
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/site/. ./
          touch .nojekyll
      - name: Publish to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: actual openForm browser app"
            git push
          fi
